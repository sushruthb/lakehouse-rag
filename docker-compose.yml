version: "3.9"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/bronze;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/gold;
      mc mb --ignore-existing local/governance;
      exit 0;
      "

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  ingestion:
    build: ./ingestion
    env_file: .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      minio-init:
        condition: service_completed_successfully
    profiles: ["pipeline"]

  dbt:
    build: ./dbt
    env_file: .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - ingestion
    profiles: ["pipeline"]

  embedding:
    build: ./embedding
    env_file: .env
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
    depends_on:
      - chromadb
      - dbt
    profiles: ["pipeline"]

  api:
    build: ./api
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - chromadb

  ui:
    build: ./ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

volumes:
  minio_data:
  chroma_data:
